name: jorick

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  migrate:
    image: pgvector/pgvector:pg17
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./schema.sql:/sql/schema.sql:ro
    command:
      - psql
      - -h
      - postgres
      - -U
      - ${POSTGRES_USER}
      - -d
      - ${POSTGRES_DB}
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /sql/schema.sql
    restart: "no"

  download:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    command: ["node", "download-corpus.js"]
    volumes:
      - ../data:/app/data
    environment:
      DATA_DIR: /app/data
    restart: "no"

  ingest:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      download:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ../data:/app/data:ro
    # Default: ingest everything in data/. Override with explicit paths:
    #   docker compose run --rm ingest data/hamlet.xml
    command: ["sh", "-c", "node ingest-corpus.js /app/data/*.xml"]
    restart: "no"

  # Opt-in RAG validation: rename characters + Yoda-corrupt famous lines.
  # See README "Verifying RAG is actually grounding answers" and
  # notes/braindump.md "On how to know this worked".
  # Invoke:  docker compose --profile corrupt run --rm corrupt
  #
  # Depends only on postgres being healthy — NOT on ingest having just run,
  # because ingest is ~25 min and rebuilds re-trigger it via depends_on.
  # The caller is responsible for having ingested first; corrupt operates
  # on whatever's currently in the passages table (idempotent if rerun).
  corrupt:
    image: pgvector/pgvector:pg17
    profiles: ["corrupt"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./corrupt.sql:/sql/corrupt.sql:ro
    command:
      - psql
      - -h
      - postgres
      - -U
      - ${POSTGRES_USER}
      - -d
      - ${POSTGRES_DB}
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /sql/corrupt.sql
    restart: "no"

volumes:
  pgdata:
