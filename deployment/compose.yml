name: jorick

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  migrate:
    image: pgvector/pgvector:pg17
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./schema.sql:/sql/schema.sql:ro
    command:
      - psql
      - -h
      - postgres
      - -U
      - ${POSTGRES_USER}
      - -d
      - ${POSTGRES_DB}
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /sql/schema.sql
    restart: "no"

  download:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    command: ["node", "download-corpus.js"]
    volumes:
      - ../data:/app/data
    environment:
      DATA_DIR: /app/data
    restart: "no"

  ingest:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      download:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ../data:/app/data:ro
    # Default: ingest everything in data/. Override with explicit paths:
    #   docker compose run --rm ingest data/hamlet.xml
    command: ["sh", "-c", "node ingest-corpus.js /app/data/*.xml"]
    restart: "no"

  jorick:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    command: ["node", "jorick/index.js"]
    ports:
      - "8080:8080"
    depends_on:
      mcp-search:
        condition: service_healthy
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      MCP_URL: ${MCP_URL:-http://mcp-search:9000/sse}
      EXO: ${EXO:-jorick}
      ENGINE: ${ENGINE:-agent-sdk}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL}
    networks:
      - default
      - jorick-langfuse
    volumes:
      - ../exo:/app/exo:ro
    restart: unless-stopped

  mcp-search:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    command: ["node", "mcp/search.js"]
    depends_on:
      postgres:
        condition: service_healthy
      corrupt:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_OPTIONS: --dns-result-order=ipv4first
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').createConnection({host:'localhost',port:9000}).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 5s
    networks:
      - default
      - jorick-langfuse
    volumes:
      - bge_cache:/app/.cache
    restart: unless-stopped

  corrupt:
    image: pgvector/pgvector:pg17
    depends_on:
      postgres:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./corrupt.sql:/sql/corrupt.sql:ro
    command:
      - psql
      - -h
      - postgres
      - -U
      - ${POSTGRES_USER}
      - -d
      - ${POSTGRES_DB}
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /sql/corrupt.sql
    restart: "no"

volumes:
  pgdata:
  bge_cache:

networks:
  jorick-langfuse:
    name: jorick-langfuse
