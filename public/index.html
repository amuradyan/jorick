<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>🎭 Jorick</title>
  <style>
    body {
      font-family: Georgia, 'Times New Roman', serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 16px;
      color: #222;
      background: #fafafa;
    }
    h1 { font-weight: normal; margin-bottom: 4px; }
    .sub { color: #777; font-size: 14px; margin-bottom: 24px; }
    form { display: flex; gap: 8px; margin-bottom: 24px; }
    input[type=text] {
      flex: 1; padding: 10px; font-size: 16px;
      border: 1px solid #bbb; border-radius: 4px;
      font-family: inherit;
    }
    button {
      padding: 10px 18px; font-size: 16px; cursor: pointer;
      background: #333; color: #fff; border: 0; border-radius: 4px;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .turn { margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid #ddd; }
    .question { font-weight: bold; margin-bottom: 10px; }
    .answer { white-space: pre-wrap; line-height: 1.55; }
    details.citations {
      margin-top: 14px; font-size: 13px; color: #555;
      font-family: 'SF Mono', Menlo, monospace;
    }
    details.citations summary { cursor: pointer; padding: 4px 0; }
    details.citations ul { margin: 8px 0; padding-left: 18px; }
    details.citations li { margin-bottom: 6px; }
    details.citations code {
      background: #eee; padding: 1px 5px; border-radius: 3px;
      font-size: 12px;
    }
    details.citations .speaker { color: #888; }
  </style>
</head>
<body>
  <h1>🎭 Jorick</h1>
  <div class="sub">/ˈʒɔːrɪk/ — Shakespeare Q&amp;A over a (possibly altered) corpus.</div>

  <form id="ask">
    <input type="text" id="question" placeholder="Ask about Shakespeare…" autofocus>
    <button id="send" type="submit">Ask</button>
  </form>

  <div id="conversation"></div>

  <script>
    const form = document.getElementById('ask');
    const input = document.getElementById('question');
    const sendBtn = document.getElementById('send');
    const log = document.getElementById('conversation');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      const turn = document.createElement('div');
      turn.className = 'turn';
      turn.innerHTML = `
        <div class="question"></div>
        <div class="answer"></div>
      `;
      turn.querySelector('.question').textContent = question;
      log.appendChild(turn);
      const answerEl = turn.querySelector('.answer');
      input.value = '';
      sendBtn.disabled = true;

      try {
        const res = await fetch('/ask', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ question }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        await consumeStream(res.body, turn, answerEl);
      } catch (err) {
        answerEl.textContent = `[error: ${err.message}]`;
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });

    async function consumeStream(stream, turn, answerEl) {
      const reader = stream.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let frameEnd;
        while ((frameEnd = buffer.indexOf('\n\n')) !== -1) {
          const frame = buffer.slice(0, frameEnd);
          buffer = buffer.slice(frameEnd + 2);
          handleFrame(frame, turn, answerEl);
        }
      }
    }

    function handleFrame(frame, turn, answerEl) {
      let event = 'message';
      let data = '';
      for (const line of frame.split('\n')) {
        if (line.startsWith('event:')) event = line.slice(6).trim();
        else if (line.startsWith('data:')) data += line.slice(5).trimStart();
      }
      if (!data) return;

      if (event === 'passages') {
        renderCitations(turn, JSON.parse(data));
      } else if (event === 'done') {
        // end of stream — nothing to render
      } else {
        // default 'message' frame — token chunk
        answerEl.textContent += JSON.parse(data);
      }
    }

    function renderCitations(turn, passages) {
      const details = document.createElement('details');
      details.className = 'citations';
      const summary = document.createElement('summary');
      summary.textContent = `${passages.length} passages retrieved`;
      details.appendChild(summary);
      const ul = document.createElement('ul');
      for (const p of passages) {
        const li = document.createElement('li');
        const code = document.createElement('code');
        code.textContent = `${p.play} ${p.act}.${p.scene}`;
        li.appendChild(code);
        li.append(' ');
        if (p.speaker) {
          const sp = document.createElement('span');
          sp.className = 'speaker';
          sp.textContent = p.speaker + ': ';
          li.appendChild(sp);
        }
        li.append(p.text);
        ul.appendChild(li);
      }
      details.appendChild(ul);
      turn.appendChild(details);
    }
  </script>
</body>
</html>
